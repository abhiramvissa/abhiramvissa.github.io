<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" viewBox="0 0 760 236" role="img" aria-labelledby="t d">
<title id="t">Two R-squared values from the same model and data</title>
<desc id="d">Random split: R² 0.9978. Trained on winter and tested on the rest of the year: R² 0.5510.</desc>
<style>text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.lab{font-size:14px;fill:#374151}.val{font-size:14px;font-weight:600;fill:#1b1f24}.tick{font-size:12px;fill:#6b7280}.axis{font-size:12px;fill:#6b7280}</style>
